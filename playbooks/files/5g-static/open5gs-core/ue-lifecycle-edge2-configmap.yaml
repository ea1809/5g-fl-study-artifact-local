    mcc: '999'
    mnc: '70'
    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643831'
    imeiSv: '4370816125816181'
    gnbSearchList:
      - gnb-edge2-service
    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
