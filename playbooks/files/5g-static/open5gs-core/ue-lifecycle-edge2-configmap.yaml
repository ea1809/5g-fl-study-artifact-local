  ue-edge2-mobility.yaml: |
    supi: 'imsi-999700000000031'
    mcc: '999'
    mnc: '70'
    key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
    op: 'E8ED289DEBA952E4283B54E88E6183CA'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643831'
    imeiSv: '4370816125816181'
    gnbSearchList:
      - gnb-edge1-service
    uacAic:
      mps: false
