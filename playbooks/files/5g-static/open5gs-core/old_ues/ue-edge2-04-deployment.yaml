apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-ue-edge2-04
  namespace: open5gs-core
  labels:
    app: ueransim
    component: ue
    name: ue-edge2-04
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim
      component: ue
      name: ue-edge2-04
  template:
    metadata:
      labels:
        app: ueransim
        component: ue
        name: ue-edge2-04
    spec:
      nodeSelector:
        edge-role: edge
      containers:
        - name: ue
          image: ueransim-iperf3:v3.2.6
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          command: ["/bin/bash", "-c", "--"]
          args:
            - /ueransim/config/wrapper.sh
          volumeMounts:
            - mountPath: /ueransim/config
              name: ue-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: ue-volume
          configMap:
            name: ue-edge2-04-configmap
            items:
              - key: ue-edge2-04.yaml
                path: ue-edge2-04.yaml
              - key: wrapper.sh
                path: wrapper.sh
                mode: 0755
