apiVersion: apps/v1
kind: Deployment
metadata:
  name: ueransim-ue-lifecycle-cloud
  namespace: open5gs-core
  labels:
    app: ueransim
    component: ue-lifecycle
    edge: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ueransim
      component: ue-lifecycle
      edge: cloud
  template:
    metadata:
      labels:
        app: ueransim
        component: ue-lifecycle
        edge: cloud
    spec:
      nodeSelector:
        edge-role: edge
      containers:
      - name: ue-lifecycle
        image: ueransim-iperf3:v3.2.6
        command: ["/bin/bash", "-c", "--"]
        args: ["/ueransim/config/wrapper.sh"]
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        volumeMounts:
        - name: ue-volume
          mountPath: /ueransim/config
      volumes:
      - name: ue-volume
        configMap:
          name: ue-lifecycle-cloud-configmap
          defaultMode: 0755
