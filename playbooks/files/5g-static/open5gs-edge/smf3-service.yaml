apiVersion: v1
kind: Service
metadata:
  name: smf3-nsmf
  namespace: open5gs-edge
  labels:
    app: open5gs
    nf: smf
    name: smf3
spec:
  selector:
    app: open5gs
    nf: smf
    name: smf3
  ports:
    - name: sbi
      port: 7777
      targetPort: 7777
    - name: pfcp
      port: 8805
      targetPort: 8805
      protocol: UDP
